<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Mockup · Usuarios</title>
<link rel="stylesheet" href="tema.css">
<style>
  .who{display:flex;gap:12px;align-items:center}
  .who b{font-family:var(--display);font-weight:500;font-size:14.5px;display:block}
  .who small{display:block;font-size:12.5px;color:var(--gris)}
  td .ba{margin:1px 4px 1px 0}
  .vacio-f td{text-align:center;color:var(--gris);padding:34px 0}
</style>
</head>
<body>
<div class="shell">
  <aside class="side" id="side"></aside>
  <main class="main">
    <span class="cel cel-racimo" aria-hidden="true"></span><span class="cel cel-flor2" aria-hidden="true"></span>
    <div class="cabecera">
      <div><h1>Usuarios</h1><p class="meta" id="meta"></p></div>
      <div class="acciones">
        <a class="btn borde" href="activar-test.html">Asignar un test</a>
        <a class="btn negro" href="alta-paciente.html">Nuevo usuario</a>
      </div>
    </div>

    <div class="card">
      <div class="flt">
        <div class="flt-r">
          <label class="flt-q">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
            <input type="search" id="q" placeholder="Busca por nombre, correo o código de tubo" aria-label="Buscar en la tabla" autocomplete="off">
          </label>
          <div class="flt-seg" id="tipo" role="group" aria-label="Tipo de test">
            <button type="button" data-t="" class="on">Todos los tipos</button>
            <button type="button" data-t="int">Intestinal</button>
            <button type="button" data-t="vag">Vaginal</button>
          </div>
          <select class="flt-sel" aria-label="Fecha"><option>Cualquier fecha</option><option>Últimos 7 días</option><option>Últimos 30 días</option><option>Últimos 3 meses</option></select>
        </div>
        <div class="flt-est" id="est" role="group" aria-label="Estado"><span class="flt-k">Estado</span></div>
        <div class="flt-act"><span id="sinf">Sin filtros</span><b id="n"></b></div>
      </div>
      <div class="tabla-wrap">
        <table class="tabla-min">
          <thead><tr><th>Usuario</th><th>Test</th><th>Estado</th><th>Última novedad</th><th>Sede</th><th>Fecha</th></tr></thead>
          <tbody id="rows"></tbody>
        </table>
      </div>
    </div>
  </main>
</div>
<script src="tema.js"></script>
<script>
  Tema.shell({ nav: 'usuarios', badges: { usuarios: 2 } });
  var ESTADOS = [['', 'Todos'], ['listo', 'Informe listo'], ['lab', 'En el laboratorio'], ['usu', 'Con el usuario'], ['rec', 'Recogida solicitada'], ['rep', 'Para repetir']];
  var LABEL = { listo: 'Informe listo', lab: 'En el laboratorio', usu: 'Con el usuario', rec: 'Recogida solicitada', rep: 'Para repetir' };
  var CLS = { listo: 'listo', lab: 'lab', usu: 'usu', rec: 'ambar', rep: 'rep' };
  // nombre, correo, tipo, estado, novedad, sede, fecha
  var D = [
    ['Lucía Martín', 'lucia.martin@ejemplo.com', 'int', 'listo', 'Informe listo ayer', 'Madrid', '27 nov'],
    ['Pablo Ruiz', 'pablo.ruiz@ejemplo.com', 'int', 'listo', 'Informe listo el 24 nov', 'Madrid', '24 nov'],
    ['Elena Torres', 'elena.torres@ejemplo.com', 'vag', 'listo', 'Informe listo hoy', 'Barcelona', '28 nov'],
    ['Marta Gil', 'marta.gil@ejemplo.com', 'int', 'rec', 'Recogida pedida para el viernes', 'Madrid', '10 nov'],
    ['Jorge Sanz', 'jorge.sanz@ejemplo.com', 'int', 'lab', 'Muestra recibida en el laboratorio', 'Madrid', '21 nov'],
    ['Nerea Cano', 'nerea.cano@ejemplo.com', 'vag', 'lab', 'Muestra recibida en el laboratorio', 'Barcelona', '20 nov'],
    ['Alba Domínguez', 'alba.dominguez@ejemplo.com', 'vag', 'usu', 'Cuestionario sin rellenar', 'Madrid', '23 nov'],
    ['Hugo Sáez', 'hugo.saez@ejemplo.com', 'int', 'usu', 'Muestra por enviar', 'Madrid', '22 nov'],
    ['Diego Alonso', 'diego.alonso@ejemplo.com', 'int', 'rep', 'Test hecho hace 6 meses', 'Barcelona', '28 may']
  ];
  var tipo = '', est = '', q = '';
  var $ = function (id) { return document.getElementById(id); };
  $('est').insertAdjacentHTML('beforeend', ESTADOS.map(function (e) {
    var c = e[0] ? D.filter(function (d) { return d[3] === e[0]; }).length : 0;
    return '<button type="button" data-e="' + e[0] + '"' + (e[0] === '' ? ' class="on"' : '') + '>' + e[1] + (e[0] ? ' · ' + c : '') + '</button>';
  }).join(''));
  (function () { var p = new URLSearchParams(location.search).get('estado'); if (p && LABEL[p]) { est = p; $('est').querySelectorAll('button').forEach(function (x) { x.classList.toggle('on', x.dataset.e === p); }); } })();
  $('meta').textContent = D.length + ' usuarios con test en curso o reciente';
  function badge(t) { return t === 'int' ? '<span class="ba int">Intestinal · Avanzado</span>' : '<span class="ba vag">Vaginal</span>'; }
  function render() {
    var rows = D.filter(function (d) {
      return (!tipo || d[2] === tipo) && (!est || d[3] === est) &&
        (!q || (d[0] + ' ' + d[1]).toLowerCase().indexOf(q) !== -1);
    });
    $('rows').innerHTML = rows.length ? rows.map(function (d) {
      return '<tr class="click" data-toast="En este mockup no está abierta la ficha de ' + d[0] + '. Mira «Ficha con test» y «Ficha sin test».">' +
        '<td><div class="who"><span class="av' + (d[2] === 'vag' ? ' vag' : '') + '">' + d[0].split(' ').map(function (x) { return x[0]; }).slice(0, 2).join('') + '</span><div><b>' + d[0] + '</b><small>' + d[1] + '</small></div></div></td>' +
        '<td>' + badge(d[2]) + '</td>' +
        '<td><span class="est ' + CLS[d[3]] + '">' + LABEL[d[3]] + '</span></td>' +
        '<td class="gr">' + d[4] + '</td>' +
        '<td class="gr">' + d[5] + '<br><a class="lnk" href="aviso-cambio-sede.html">Mover de sede</a></td>' +
        '<td class="gr">' + d[6] + '</td></tr>';
    }).join('') : '<tr class="vacio-f"><td colspan="6">Ningún usuario con estos filtros.</td></tr>';
    $('n').textContent = rows.length + ' de ' + D.length;
    $('sinf').textContent = (tipo || est || q) ? 'Con filtros' : 'Sin filtros';
  }
  $('q').addEventListener('input', function (e) { q = e.target.value.trim().toLowerCase(); render(); });
  $('tipo').addEventListener('click', function (e) {
    var b = e.target.closest('button'); if (!b) return; tipo = b.dataset.t;
    this.querySelectorAll('button').forEach(function (x) { x.classList.toggle('on', x === b); }); render();
  });
  $('est').addEventListener('click', function (e) {
    var b = e.target.closest('button'); if (!b) return; est = b.dataset.e;
    this.querySelectorAll('button').forEach(function (x) { x.classList.toggle('on', x === b); }); render();
  });
  $('rows').addEventListener('click', function (e) {
    if (e.target.closest('a')) return;
    var tr = e.target.closest('tr[data-toast]'); if (tr) Tema.toast(tr.dataset.toast);
  });
  render();
</script>
</body>
</html>
