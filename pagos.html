<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Mockup · Pedidos</title>
<link rel="stylesheet" href="tema.css">
<style>
  .f-fila{display:flex;gap:12px;flex-wrap:wrap;align-items:center;margin-top:12px}
  .f-fila label{font-size:12.5px;color:var(--gris);display:flex;align-items:center;gap:6px}
  .f-fila input[type=date]{font:inherit;font-size:13.5px;border:0;border-radius:999px;padding:7px 14px;background:var(--blanco);box-shadow:inset 0 0 0 1px var(--linea2)}
  .sortb{font-weight:400;font-size:12px;color:var(--gris)}
  .sortb.on{color:var(--tinta)}
  .sortb i{font-style:normal;font-size:10px;margin-left:3px}
  .cx-t{display:block;font-size:12px;color:var(--rojo);margin-top:3px}
  .pc-t{display:block;font-size:12px;color:var(--ambar-tinta);margin-top:3px}
  .chips-r{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
  .item{display:flex;justify-content:space-between;align-items:center;gap:14px;padding:14px 16px;border-radius:16px;background:var(--papel2);margin-bottom:10px}
  .item b{font-family:var(--display);font-weight:500;display:block}
  .item small{color:var(--gris);font-size:12.5px}
  .prep{font-size:13px;color:var(--gris);white-space:nowrap}
  .prep.ok{color:var(--verde-tinta);font-weight:500}
  .two{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:26px;margin-top:16px}
  .ttl-s{font-size:11.5px;letter-spacing:.08em;color:var(--gris);text-transform:uppercase;margin:0 0 8px}
  .tile{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 16px;border-radius:14px;box-shadow:inset 0 0 0 1px var(--linea);margin-bottom:8px}
  .tile small{display:block;font-size:13px}.tile em{font-style:normal;font-size:12px;color:var(--gris)}
  .tile b{font:500 22px var(--display)}
  .tile.disc{background:var(--verde2);color:var(--verde-tinta);box-shadow:none}.tile.disc em{color:var(--verde-tinta)}
  .ln{display:flex;justify-content:space-between;padding:8px 0;color:#3a3a37}
  .ln.d{color:var(--verde-tinta);font-weight:500}
  .ln.sep{border-top:1px solid var(--linea);margin-top:4px}
  .ln.tot{border-top:2px solid var(--tinta);margin-top:6px;padding-top:12px;font:500 20px var(--display);color:var(--tinta)}
  .ln .inc{color:var(--verde-tinta)}
  .sfoot{font-size:13px;color:var(--gris);margin-top:12px}
  .minis{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin-top:16px}
  .mini{display:flex;gap:12px;align-items:center;background:var(--blanco);border-radius:18px;box-shadow:var(--blk-sombra);padding:14px 16px}
  .mini .ico{width:36px;height:36px;font-size:15px}
  .mini small{display:block;font-size:12px;color:var(--gris)}
  .mini b{font-family:var(--display);font-weight:500}
  /* Factura */
  .modal.fac{width:min(900px,100% - 32px);background:var(--blanco)}
  .doc{padding:30px 34px 10px}
  .dh{display:flex;justify-content:space-between;align-items:flex-start;gap:20px;flex-wrap:wrap;padding-bottom:16px;border-bottom:1px solid var(--linea)}
  .dh .lg img{height:18px;width:130px;display:block;margin-bottom:6px}
  .dh .lg small{display:block;color:var(--gris);font-size:12px;max-width:34ch}
  .dh .num{text-align:right}.dh .num small{display:block;font-size:11px;letter-spacing:.1em;color:var(--gris)}.dh .num b{font:500 24px var(--display);display:block;margin:2px 0 6px}
  .dmeta{display:grid;grid-template-columns:repeat(5,auto);justify-content:start;gap:36px;padding:14px 0;border-bottom:1px solid var(--linea);font-size:13px;text-align:left}
  .lbl{display:block;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--gris);margin-bottom:3px}
  .parties{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:22px;padding:18px 0;border-bottom:1px solid var(--linea)}
  .party b{font-family:var(--display);font-weight:500;display:block}
  .party p{font-size:13px;color:var(--gris);line-height:1.55;margin-top:2px}
  .bk{width:100%;border-collapse:collapse;margin-top:6px;font-size:13.5px}
  .bk th{font-size:11.5px;font-weight:400;color:var(--gris);text-align:right;padding:12px 8px 8px;border-bottom:1px solid var(--linea2)}
  .bk th:first-child,.bk td:first-child{text-align:left;padding-left:0}
  .bk td{padding:12px 8px;border-bottom:1px solid var(--linea);text-align:right;vertical-align:top}
  .bk td small{display:block;color:var(--gris);font-size:12px;margin-top:2px}
  .bk td ul{margin:6px 0 0;padding-left:16px;color:var(--gris);font-size:12.5px;text-align:left}
  .bk .enf{color:var(--gris)}
  .bkfoot{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,340px);gap:26px;padding:16px 0 6px}
  .bnote{font-size:12.5px;color:var(--gris);line-height:1.6}
  .sums .row{display:flex;justify-content:space-between;padding:7px 0;border-bottom:1px solid var(--linea);font-size:13.5px}
  .sums .row.save{color:var(--verde-tinta)}
  .sums .totbox{margin-top:10px;display:flex;justify-content:space-between;align-items:center;padding:12px 16px;border-radius:14px;background:var(--cobalto2)}
  .sums .totbox span{font-size:12px;letter-spacing:.1em;font-family:var(--display);font-weight:500}.sums .totbox b{font:500 24px var(--display)}
  .paidline{margin-top:10px;font-size:13px;padding:8px 12px;border-radius:12px;text-align:center}
  .paidline.ok{background:var(--verde2);color:var(--verde-tinta)}.paidline.pend{background:var(--ambar2);color:var(--ambar-tinta)}.paidline.cx{background:var(--rojo2);color:var(--rojo)}
  .dfoot{font-size:12px;color:var(--gris);padding:10px 0 16px;border-top:1px solid var(--linea)}
  .inv-a{display:flex;justify-content:flex-end;gap:10px;padding:14px 24px;border-top:1px solid var(--linea);background:var(--blanco);border-radius:0 0 24px 24px;position:sticky;bottom:0}
  #vDetail .minis+.card{margin-top:16px}
  @media (max-width:900px){.two,.bkfoot,.parties,.minis{grid-template-columns:minmax(0,1fr)}.dmeta{grid-template-columns:repeat(2,auto)}}
</style>
</head>
<body>
<div class="shell">
  <aside class="side" id="side"></aside>
  <main class="main">

    <!-- ===== Listado ===== -->
    <section id="vList">
      <span class="cel cel-doble" aria-hidden="true"></span>
      <div class="cabecera">
        <div><h1>Pedidos</h1><p class="meta">Los pedidos de tu centro, los pendientes de pago primero.</p></div>
        <div class="acciones"><a class="btn negro" href="pedir-tests.html">Nuevo pedido</a></div>
      </div>
      <div class="card">
        <div class="flt">
          <div class="flt-est" style="margin-top:0" id="fEstado" role="group" aria-label="Estado"><span class="flt-k">Estado</span>
            <button type="button" data-e="" class="on">Todos</button><button type="button" data-e="pend">Pendiente de pago</button><button type="button" data-e="paid">Pagado</button><button type="button" data-e="cx">Solicitud cancelada</button></div>
          <div class="f-fila">
            <span class="flt-seg" id="fTipo" role="group" aria-label="Filtrar por"><button type="button" data-t="req" class="on">Fecha de solicitud</button><button type="button" data-t="pay">Fecha de pago</button></span>
            <label>Desde <input type="date" id="fDesde"></label><label>Hasta <input type="date" id="fHasta"></label>
            <button type="button" class="lnk" id="fClear">Limpiar filtros</button>
          </div>
          <div class="flt-act"><span></span><b id="count"></b></div>
        </div>
        <div class="tabla-wrap"><table class="tabla-min" id="list"></table></div>
      </div>
    </section>

    <!-- ===== Detalle ===== -->
    <section id="vDetail" hidden>
      <p class="migas"><button type="button" class="lnk" id="backList">Pedidos</button> / <span id="crumbN"></span></p>
      <div class="cabecera">
        <div><h1>Tu pedido</h1><p class="meta" id="dMeta"></p></div>
        <div class="acciones"><button class="btn rojo" id="cxBtn" hidden type="button">✕ Cancelar solicitud</button><button class="btn borde" id="invBtn" hidden type="button">Ver factura</button></div>
      </div>
      <div class="banda" id="dPay"></div>
      <div class="card" style="margin-top:16px">
        <div class="card-h"><h2>Resumen del pedido</h2><small id="dNum"></small></div>
        <div id="dBreak"></div>
      </div>
      <div class="minis" id="dFacts"></div>
      <div class="card">
        <div class="card-h"><h2>Envío</h2><span id="dShipSt" class="est"></span></div>
        <ol class="track cuatro" id="dTl"></ol>
      </div>
    </section>
  </main>
</div>

<div class="velo" id="velo" hidden></div>

<!-- Factura (solo pedidos pagados) -->
<div class="modal fac" id="invOv" hidden role="dialog" aria-modal="true" aria-label="Factura">
  <div class="doc" id="invDoc"></div>
  <div class="inv-a"><button class="btn borde" type="button" id="invClose">Cerrar</button><button class="btn negro" type="button" id="invPdf">Descargar PDF</button></div>
</div>
<!-- Confirmar cancelación -->
<div class="modal sm" id="cxOv" hidden role="dialog" aria-modal="true" aria-labelledby="cxT">
  <div class="m-cab"><span class="ico" style="background:var(--rojo)">✕</span><div><h2 id="cxT">¿Cancelar esta solicitud?</h2><p id="cxTxt"></p></div></div>
  <div class="m-cuerpo"><div class="aviso rojo" style="margin:6px 0 14px;display:block">No se enviarán los tests ni se cobrará nada. Esta acción no se puede deshacer.</div></div>
  <div class="m-pie"><span class="res"></span><div class="bots"><button type="button" class="btn borde" id="cxBack">Volver</button><button type="button" class="btn rojo" id="cxDo" style="background:var(--rojo);color:#fff;box-shadow:none">Sí, cancelar solicitud</button></div></div>
</div>

<script src="tema.js"></script>
<script>
  Tema.shell({ nav: 'pedidos', badges: { usuarios: 2 }, handlers: { pedidos: function () { showList(); } } });
  var $ = function (id) { return document.getElementById(id); };
  var eur = function (n) { var p = Math.abs(n).toFixed(2).split('.'); return (n < 0 ? '−' : '') + p[0].replace(/\B(?=(\d{3})+(?!\d))/g, '.') + ',' + p[1] + ' €'; };
  // Cifras de ejemplo (inventadas): precio por test sin IVA y un 15 % de descuento de la clínica
  var T = function (v) { return Math.round(v * 100) / 100; };
  var INCL = ['Tubo de recogida de la muestra', 'Recogida de la muestra y envío al laboratorio', 'Secuenciación y análisis de la microbiota'];
  var PROD = {
    nut: { name: 'Test avanzado de microbiota intestinal', enf: 'Nutrición', ref: 'TAI-NUT', pu: 225.00, incl: INCL.concat(['Informe con recomendaciones de alimentos, prebióticos y probióticos']) },
    muj: { name: 'Test avanzado de microbiota intestinal', enf: 'Mujer', ref: 'TAI-MUJ', pu: 225.00, incl: INCL.concat(['Informe con recomendaciones adaptadas a la salud de la mujer']) },
    vag: { name: 'Test avanzado de microbiota vaginal', enf: null, ref: 'TAV', pu: 168.00, incl: INCL.concat(['Informe con recomendaciones para la salud vaginal']) }
  };
  var DISC = .15;
  // Quién emite y a quién se factura (el centro y sus datos son de ejemplo)
  var EMISOR = { name: 'Biotahealth S.L.', brand: 'Biotasmart', addr: 'Travessia s/n, Bloque E, Esc. 1<br>46024 Valencia, España', nif: 'B19872431', mail: 'hola@biotasmart.com' };
  var CLIENTE = { name: 'Centro Demo S.L.', brand: 'Centro Demo', addr: 'Calle de Ejemplo, 12<br>46004 Valencia, España', nif: 'B00000000', mail: 'facturacion@centro-ejemplo.es' };
  var SEDES = { Madrid: 'Calle Santa Ana, 12<br>28001 Madrid, España' };
  function mk(id, items, ship, shipCls, paidOn, sent, done, shipSt, tl) {
    var lines = items.map(function (it) { var p = PROD[it[0]]; return Object.assign({}, p, { q: it[1], imp: T(it[1] * p.pu * (1 - DISC)) }); });
    var tests = lines.reduce(function (s, l) { return s + l.q; }, 0), gross = T(lines.reduce(function (s, l) { return s + l.q * l.pu; }, 0)),
      base = T(lines.reduce(function (s, l) { return s + l.imp; }, 0)), iva = T(base * .21), d = id.split('/');
    return { id: id, num: 'PED-' + d[2] + '-' + d[1] + d[0], lines: lines, tests: tests, gross: gross, ship: ship, shipCls: shipCls, paid: !!paidOn, paidOn: paidOn, base: base, iva: iva, total: T(base + iva), sede: 'Madrid', sent: sent, done: done, shipSt: shipSt, tl: tl };
  }
  var ORDERS = [
    mk('18/11/2026', [['nut', 4], ['muj', 2], ['vag', 1]], 'Pendiente', 'ambar', null, '—', '—', 'Pedido confirmado', [['Confirmado', '18/11/2026'], ['Preparado', null], ['Enviado', null], ['Entregado', null]]),
    mk('17/11/2026', [['nut', 2]], 'Entregado', 'verde', null, '18/11/2026', '20/11/2026', 'Entregado', [['Confirmado', '17/11/2026'], ['Preparado', '18/11/2026'], ['Enviado', '18/11/2026'], ['Entregado', '20/11/2026']]),
    mk('02/11/2026', [['nut', 2], ['vag', 1]], 'Entregado', 'verde', '03/11/2026', '04/11/2026', '06/11/2026', 'Entregado', [['Confirmado', '02/11/2026'], ['Preparado', '03/11/2026'], ['Enviado', '04/11/2026'], ['Entregado', '06/11/2026']]),
    mk('20/10/2026', [['nut', 3], ['muj', 2]], 'Entregado', 'verde', '21/10/2026', '22/10/2026', '24/10/2026', 'Entregado', [['Confirmado', '20/10/2026'], ['Preparado', '21/10/2026'], ['Enviado', '22/10/2026'], ['Entregado', '24/10/2026']]),
    mk('28/09/2026', [['vag', 2]], 'Entregado', 'verde', '30/09/2026', '01/10/2026', '03/10/2026', 'Entregado', [['Confirmado', '28/09/2026'], ['Preparado', '30/09/2026'], ['Enviado', '01/10/2026'], ['Entregado', '03/10/2026']]),
    mk('10/11/2026', [['nut', 2]], 'Cancelado', 'rojo', null, '—', '—', 'Solicitud cancelada', [['Confirmado', '10/11/2026'], ['Cancelada', '11/11/2026'], ['Enviado', null], ['Entregado', null]])
  ];
  ORDERS[5].cancelled = '11/11/2026';
  var TODAY = function () { var d = new Date(); return [d.getDate(), d.getMonth() + 1, d.getFullYear()].map(function (n) { return String(n).padStart(2, '0'); }).join('/'); };
  // Solo se puede cancelar mientras no está pagada ni se ha empezado a preparar
  var canCancel = function (o) { return !o.paid && !o.cancelled && o.ship === 'Pendiente'; };
  var iso = function (d) { return d ? d.split('/').reverse().join('-') : ''; };   // dd/mm/aaaa → aaaa-mm-dd

  // ===== Resumen del pedido =====
  function summary(o) {
    var done = o.ship === 'Entregado', pct = Math.round(DISC * 100), short = function (n) { return n.replace('Test avanzado de microbiota ', 'Microbiota ') + ' Avanzado'; };
    var items = o.lines.map(function (l) {
      return '<div class="item"><div><b>' + l.q + ' test' + (l.q > 1 ? 's' : '') + ' · ' + short(l.name) + (l.enf ? ' · ' + l.enf : '') + '</b><small>Envío Paq24 a tu consulta incluido</small></div>' +
        (o.cancelled ? '' : '<span class="prep' + (done ? ' ok' : '') + '">' + (done ? '✓ ' + l.q + '/' + l.q : '0/' + l.q) + ' preparados</span>') + '</div>';
    }).join('');
    var seen = {}, tiles = o.lines.filter(function (l) { var k = l.name + l.pu; if (seen[k]) return false; seen[k] = 1; return true; }).map(function (l) {
      var net = T(l.pu * (1 - DISC)); return '<div class="tile"><div><small>' + short(l.name) + '</small><em>sin IVA ' + eur(net) + ' · con descuento</em></div><b>' + eur(T(net * 1.21)) + '</b></div>';
    }).join('');
    var save = T(o.gross - o.base);
    return items + '<div class="two"><div><p class="ttl-s">Precio por test (con IVA)</p>' + tiles +
      '<div class="tile disc"><div><small>Descuento por tu pedido</small><em>ahorras ' + eur(save) + ' (sin IVA) en este pedido</em></div><b>−' + pct + ' %</b></div></div>' +
      '<div><p class="ttl-s">Desglose</p>' + o.lines.map(function (l) { return '<div class="ln"><span>' + l.q + ' × ' + eur(l.pu) + ' (tarifa)</span><span>' + eur(T(l.q * l.pu)) + '</span></div>'; }).join('') +
      '<div class="ln d"><span>Descuento por pedido (' + pct + ' %)</span><span>−' + eur(save) + '</span></div>' +
      '<div class="ln sep"><span>Base imponible</span><span>' + eur(o.base) + '</span></div><div class="ln"><span>IVA (21 %)</span><span>' + eur(o.iva) + '</span></div>' +
      '<div class="ln"><span>Envío Paq24</span><span class="inc">Incluido</span></div><div class="ln tot"><span>Total</span><span>' + eur(o.total) + '</span></div>' +
      (o.cancelled ? '<p class="sfoot" style="color:var(--rojo)">Solicitud cancelada el ' + o.cancelled + ' · no se ha cobrado.</p>' : '') + '</div></div>';
  }
  // ===== Factura: bloques =====
  function parties(o) {
    return '<div class="parties"><div class="party"><span class="lbl">Emitida por</span><b>' + EMISOR.name + '</b><p>' + EMISOR.brand + '<br>' + EMISOR.addr + '<br>NIF ' + EMISOR.nif + '<br>' + EMISOR.mail + '</p></div>' +
      '<div class="party"><span class="lbl">Facturar a</span><b>' + CLIENTE.name + '</b><p>' + CLIENTE.brand + '<br>' + CLIENTE.addr + '<br>NIF ' + CLIENTE.nif + '<br>' + CLIENTE.mail + '</p></div>' +
      '<div class="party"><span class="lbl">Enviar a</span><b>' + CLIENTE.brand + ' · Sede ' + o.sede + '</b><p>' + SEDES[o.sede] + '<br>Envío Paq24 (24 h laborables)</p></div></div>';
  }
  function lineas(o) {
    return '<table class="bk"><tr><th>Descripción</th><th>Cant.</th><th>Precio/ud</th><th>Dto.</th><th>Importe</th></tr>' +
      o.lines.map(function (l) {
        return '<tr><td><b>' + l.name + '</b>' + (l.enf ? ' <span class="enf">· Enfoque ' + l.enf + '</span>' : '') + '<small>Ref. ' + l.ref + ' · precio unitario sin IVA</small><ul>' + l.incl.map(function (x) { return '<li>' + x + '</li>'; }).join('') + '</ul></td>' +
          '<td>' + l.q + '</td><td>' + eur(l.pu) + '</td><td>−' + Math.round(DISC * 100) + ' %</td><td>' + eur(l.imp) + '</td></tr>';
      }).join('') + '<tr><td><b>Envío Paq24 a la sede ' + o.sede + '</b><small>Entrega en 24 h laborables</small></td><td>1</td><td>' + eur(0) + '</td><td>—</td><td>Incluido</td></tr></table>';
  }
  function totales(o) {
    var save = T(o.gross - o.base), pct = Math.round(DISC * 100);
    return '<div class="bkfoot"><div class="bnote"><b>Nota:</b> pedido <b>' + o.num + '</b> del ' + o.id + ' · ' + o.tests + ' test' + (o.tests > 1 ? 's' : '') + ' para la sede <b>' + o.sede + '</b>.<br>Precios unitarios sin IVA. El descuento de tu centro (−' + pct + ' %) se aplica en cada línea: ahorras <b>' + eur(save) + '</b>.</div>' +
      '<div class="sums"><div class="row"><span>Importe sin descuento</span><span>' + eur(o.gross) + '</span></div><div class="row save"><span>Descuento del centro (−' + pct + ' %)</span><span>−' + eur(save) + '</span></div>' +
      '<div class="row"><span>Base imponible</span><span>' + eur(o.base) + '</span></div><div class="row"><span>IVA (21 %)</span><span>' + eur(o.iva) + '</span></div><div class="totbox"><span>TOTAL</span><b>' + eur(o.total) + '</b></div>' +
      (o.cancelled ? '<div class="paidline cx">✕ Solicitud cancelada el ' + o.cancelled + ' · no se ha cobrado</div>' : o.paid ? '<div class="paidline ok">✓ Pagado el ' + o.paidOn + ' con tarjeta ···· 4242</div>' : '<div class="paidline pend">Pendiente de pago</div>') + '</div></div>';
  }

  // ===== Listado: filtros + columnas ordenables =====
  var sortKey = 'default', sortDir = -1, fe = '', ft = 'req';
  var COLS = [['estado', 'Estado', ''], ['req', 'Fecha de solicitud', ''], ['pay', 'Fecha de pago', ''], ['total', 'Total', 'r']];
  function val(o, k) { return k === 'estado' ? (o.cancelled ? 2 : o.paid ? 1 : 0) : k === 'total' ? o.total : k === 'req' ? iso(o.id) : iso(o.paidOn) || '0000'; }
  function renderList() {
    var fd = $('fDesde').value, fh = $('fHasta').value;
    var rows = ORDERS.map(function (o, i) { return { o: o, i: i }; }).filter(function (r) {
      var o = r.o;
      if (fe === 'pend' && (o.paid || o.cancelled)) return false;
      if (fe === 'paid' && !o.paid) return false;
      if (fe === 'cx' && !o.cancelled) return false;
      var d = ft === 'pay' ? iso(o.paidOn) : iso(o.id);
      if ((fd || fh) && !d) return false; if (fd && d < fd) return false; if (fh && d > fh) return false;
      return true;
    });
    rows.sort(function (a, b) {
      if (sortKey === 'default') { var ga = a.o.paid || !!a.o.cancelled, gb = b.o.paid || !!b.o.cancelled; if (ga !== gb) return ga ? 1 : -1; return iso(b.o.id).localeCompare(iso(a.o.id)); }
      var x = val(a.o, sortKey), y = val(b.o, sortKey); return (x > y ? 1 : x < y ? -1 : 0) * sortDir;
    });
    var head = '<thead><tr>' + COLS.map(function (c) { return '<th class="' + c[2] + '"><button class="sortb ' + (sortKey === c[0] ? 'on' : '') + '" data-sort="' + c[0] + '" type="button">' + c[1] + ' <i>' + (sortKey === c[0] ? (sortDir > 0 ? '▲' : '▼') : '↕') + '</i></button></th>'; }).join('') + '<th></th></tr></thead>';
    $('list').innerHTML = head + '<tbody>' + (rows.length ? rows.map(function (r) {
      var o = r.o, est = o.cancelled ? '<span class="est rojo">Solicitud cancelada</span><span class="cx-t">Cancelada el ' + o.cancelled + '</span>'
        : o.paid ? '<span class="est verde">Pagado</span>'
        : o.ship === 'Entregado' ? '<span class="est verde">Entregado</span><span class="pc-t">Pendiente de pago</span>' : '<span class="est ambar">Pendiente de pago</span>';
      return '<tr class="click" data-i="' + r.i + '"><td>' + est + '</td><td>' + o.id + '</td><td>' + (o.paidOn || '<span class="gr">—</span>') + '</td><td class="r">' + eur(o.total) + '<span class="sub">' + o.tests + ' test' + (o.tests > 1 ? 's' : '') + '</span></td><td class="r"><span class="lnk">Ver →</span></td></tr>';
    }).join('') : '<tr><td colspan="5" class="gr" style="text-align:center;padding:30px 0">Ningún pedido coincide con los filtros.</td></tr>') + '</tbody>';
    $('count').textContent = rows.length + ' de ' + ORDERS.length + ' pedidos';
  }
  $('list').addEventListener('click', function (e) {
    var s = e.target.closest('[data-sort]');
    if (s) { var k = s.dataset.sort; if (sortKey === k) sortDir = -sortDir; else { sortKey = k; sortDir = k === 'estado' ? 1 : -1; } renderList(); return; }
    var tr = e.target.closest('tr[data-i]'); if (tr) showDetail(+tr.dataset.i);
  });
  $('fEstado').addEventListener('click', function (e) { var b = e.target.closest('button'); if (!b) return; fe = b.dataset.e; this.querySelectorAll('button').forEach(function (x) { x.classList.toggle('on', x === b); }); renderList(); });
  $('fTipo').addEventListener('click', function (e) { var b = e.target.closest('button'); if (!b) return; ft = b.dataset.t; this.querySelectorAll('button').forEach(function (x) { x.classList.toggle('on', x === b); }); renderList(); });
  ['fDesde', 'fHasta'].forEach(function (id) { $(id).addEventListener('change', renderList); });
  $('fClear').addEventListener('click', function () {
    fe = ''; ft = 'req'; $('fDesde').value = ''; $('fHasta').value = ''; sortKey = 'default'; sortDir = -1;
    $('fEstado').querySelectorAll('button').forEach(function (x) { x.classList.toggle('on', x.dataset.e === ''); });
    $('fTipo').querySelectorAll('button').forEach(function (x) { x.classList.toggle('on', x.dataset.t === 'req'); }); renderList();
  });
  function showList() { renderList(); $('vList').hidden = false; $('vDetail').hidden = true; window.scrollTo(0, 0); }
  $('backList').addEventListener('click', showList);

  // ===== Modales =====
  function openM(id) { $('velo').hidden = false; $(id).hidden = false; }
  function closeM() { $('velo').hidden = true; $('invOv').hidden = true; $('cxOv').hidden = true; }
  $('velo').addEventListener('click', closeM);
  document.addEventListener('keydown', function (e) { if (e.key === 'Escape') closeM(); });
  var curOrder = 0;
  function openInv() {
    var o = ORDERS[curOrder], nf = 'BTS-2026-' + String(40 + curOrder).padStart(4, '0');
    $('invDoc').innerHTML = '<div class="dh"><div class="lg"><img src="' + Tema.base + 'assets/logo.svg" alt="Biotasmart"><small>Interpretación avanzada de microbiota para profesionales sanitarios.</small></div>' +
      '<div class="num"><small>FACTURA</small><b>' + nf + '</b><span class="est verde">Pagada</span></div></div>' +
      '<div class="dmeta"><div><span class="lbl">Fecha de emisión</span>' + o.paidOn + '</div><div><span class="lbl">Fecha de pago</span>' + o.paidOn + '</div><div><span class="lbl">Nº de pedido</span>' + o.num + '</div><div><span class="lbl">Fecha del pedido</span>' + o.id + '</div><div><span class="lbl">Forma de pago</span>Tarjeta</div></div>' +
      parties(o) + lineas(o) + totales(o) +
      '<div class="dfoot">Precios unitarios sin IVA; IVA al tipo general (21 %). Para cualquier consulta sobre esta factura, escribe a ' + EMISOR.mail + ' indicando su número (' + nf + ').</div>';
    openM('invOv');
  }
  $('invBtn').addEventListener('click', openInv); $('invClose').addEventListener('click', closeM);
  $('invPdf').addEventListener('click', function () { Tema.toast('Descargando factura en PDF…'); });

  function showDetail(i) {
    var o = ORDERS[i]; curOrder = i;
    $('invBtn').hidden = !o.paid; $('cxBtn').hidden = !canCancel(o);
    $('vList').hidden = true; $('vDetail').hidden = false; window.scrollTo(0, 0);
    $('crumbN').textContent = 'Pedido del ' + o.id;
    $('dMeta').innerHTML = '<span class="est ' + o.shipCls + '">Envío: ' + o.ship + '</span> &nbsp;Centro Demo · Pedido emitido el ' + o.id;
    var pay = $('dPay');
    pay.className = 'banda' + (o.cancelled ? ' rojo' : o.paid ? ' verde' : '');
    pay.innerHTML = o.cancelled
      ? '<span class="ico">✕</span><div><h2>Solicitud cancelada</h2><p>Cancelada el ' + o.cancelled + '. No se enviarán los tests ni se cobrará nada.</p></div><div class="fin"><b style="font:500 28px var(--display)">' + eur(o.total) + '</b><small>No se cobra</small></div>'
      : o.paid
      ? '<span class="ico">✓</span><div><h2>Pagado</h2><p>Gracias, el pago está registrado.</p></div><div class="fin"><div style="text-align:right"><b style="font:500 28px var(--display);display:block">' + eur(o.total) + '</b><small>IVA incluido</small></div></div>'
      : '<span class="ico">▤</span><div><h2>Pendiente de pago</h2><p>La factura llegará con la entrega.</p></div><div class="fin"><div style="text-align:right"><b style="font:500 28px var(--display);display:block">' + eur(o.total) + '</b><small>IVA incluido</small></div>' +
        '<button class="btn blanco grande" id="payBtn" type="button">Pagar ' + eur(o.total) + ' →</button></div>';
    if ($('payBtn')) $('payBtn').addEventListener('click', function () { payNow(i); });
    $('dNum').textContent = o.num;
    $('dBreak').innerHTML = summary(o);
    $('dFacts').innerHTML = '<div class="mini"><span class="ico az">⌂</span><div><small>Sede</small><b>' + o.sede + '</b></div></div>' +
      '<div class="mini"><span class="ico os">↗</span><div><small>Enviada</small><b>' + o.sent + '</b></div></div>' +
      (o.cancelled ? '<div class="mini"><span class="ico" style="background:var(--rojo)">✕</span><div><small>Cancelada</small><b style="color:var(--rojo)">' + o.cancelled + '</b></div></div>'
        : '<div class="mini"><span class="ico ve">✓</span><div><small>Completada</small><b>' + o.done + '</b></div></div>');
    var st = $('dShipSt'); st.textContent = o.shipSt; st.className = 'est ' + (o.cancelled ? 'rojo' : o.shipCls === 'verde' ? 'verde' : 'azul');
    var last = o.tl.map(function (e) { return !!e[1]; }).lastIndexOf(true);
    $('dTl').innerHTML = o.tl.map(function (e, k) {
      var cx = o.cancelled && e[0] === 'Cancelada', na = o.cancelled && !e[1];
      return '<li class="' + (cx ? 'cx' : na ? '' : e[1] ? (k === last ? 'ya' : 'ok') : '') + '">' + e[0] + '<small>' + (e[1] || (na ? 'No aplica' : 'Pendiente')) + '</small></li>';
    }).join('');
  }
  // ===== Cancelar la solicitud (solo antes de pagar y de preparar el pedido) =====
  $('cxBtn').addEventListener('click', function () {
    var o = ORDERS[curOrder];
    $('cxTxt').innerHTML = 'Vas a cancelar el pedido <b>' + o.num + '</b> del ' + o.id + ': ' + o.tests + ' test' + (o.tests > 1 ? 's' : '') + ' por <b>' + eur(o.total) + '</b>.';
    openM('cxOv');
  });
  $('cxBack').addEventListener('click', closeM);
  $('cxDo').addEventListener('click', function () {
    var o = ORDERS[curOrder], t = TODAY();
    Object.assign(o, { cancelled: t, ship: 'Cancelado', shipCls: 'rojo', shipSt: 'Solicitud cancelada', tl: [['Confirmado', o.id], ['Cancelada', t], ['Enviado', null], ['Entregado', null]] });
    closeM(); showDetail(curOrder); Tema.toast('Solicitud cancelada');
  });
  // Simulación del pago (en la plataforma real abriría la pasarela de pago)
  function payNow(i) {
    var b = $('payBtn'); b.disabled = true; b.textContent = 'Abriendo pago seguro…';
    setTimeout(function () { ORDERS[i].paid = true; ORDERS[i].paidOn = TODAY(); showDetail(i); }, 1200);
  }
  showList();
</script>
</body>
</html>
